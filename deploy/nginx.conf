# Обратный прокси перед приложением (deploy/install.sh подставляет домен и порт).
# HTTPS и переадресацию с http при установке добавляет certbot --nginx --redirect --hsts; b2b-set-domain пишет их сам.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Боты-сканеры шлют поддельный заголовок Next-Action (например «x»), ища уязвимость React2Shell.
    # Настоящий идентификатор действия — шестнадцатеричная строка (в Next.js 16 — 42 символа).
    # Отсекаем подделки здесь: иначе Next.js пишет в журнал ошибки, и они приходят тревогой в Telegram.
    if ($http_next_action !~ "^([0-9a-f]{16,128})?$") { return 400; }

    # Самая тяжёлая форма — заявка на замену: 4 фото по 10 МБ и видео до 50 МБ (next.config.ts)
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Приложение берёт последний адрес из X-Forwarded-For (лимит попыток входа, журнал), README
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Сборка Next.js: имена файлов с хешем, можно кешировать надолго
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
