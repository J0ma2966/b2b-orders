# Сборка мобильных приложений: проверка, что Android и iOS проекты собираются.
# Android: отладочный APK в артефактах запуска. iOS: сборка для симулятора без подписи
# (подписанная сборка для App Store делается в Xcode на Mac — см. docs/mobile.md).
# Адрес сервера — переменная репозитория MOBILE_SERVER_URL (Settings → Secrets and variables → Actions → Variables).
name: Mobile

on:
  pull_request:
    paths: ["mobile/**", "capacitor.config.ts", "package.json", "package-lock.json", "scripts/mobile-*", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "capacitor.config.ts", "package.json", "package-lock.json", "scripts/mobile-*", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOBILE_SERVER_URL: ${{ vars.MOBILE_SERVER_URL || 'https://app.example.uz' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Push на Android: файл из Firebase (docs/mobile.md, «Push-уведомления») хранится в секрете репозитория
      # GOOGLE_SERVICES_JSON. Без секрета APK собирается как раньше, только системные push в нём выключены.
      - name: Firebase для push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            node -e "const j=require('./mobile/android/app/google-services.json'); const ok=j.client?.some(c=>c.client_info?.android_client_info?.package_name==='uz.b2borders.app'); console.log('google-services.json: проект', j.project_info?.project_id, ok ? '— приложение uz.b2borders.app найдено' : '— ВНИМАНИЕ: нет приложения uz.b2borders.app'); if(!ok) process.exit(1)"
          else
            echo "Секрет GOOGLE_SERVICES_JSON не задан — APK без системных push"
          fi
      - run: npm run mobile:sync -- android
      - name: Сборка APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # Отладочный APK для проверки в своей Wi‑Fi сети: адрес сервера вводится на телефоне (docs/local-wifi.md)
      - name: APK для проверки по Wi‑Fi
        run: |
          MOBILE_DEV_SETUP=1 npm run mobile:sync -- android
          (cd mobile/android && ./gradlew --no-daemon assembleDebug)
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk b2b-orders-wifi-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-wifi-test-apk
          path: b2b-orders-wifi-test.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: mobile/android/app/build/reports/lint-results-debug.html
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync -- ios
      - name: Сборка для симулятора
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0
