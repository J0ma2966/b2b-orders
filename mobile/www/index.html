<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OptoLink</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6f8; color: #1d2433;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  main { width: 100%; max-width: 380px; }
  .icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; background: #5b3fd6; display: grid; place-items: center; color: #fff; font-size: 32px; }
  h1 { font-size: 20px; margin: 0 0 6px; text-align: center; }
  p { margin: 0 0 6px; color: #5b6475; font-size: 15px; }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; min-height: 50px; border: 1px solid #c9cfda; border-radius: 12px; padding: 0 14px; font-size: 17px; background: #fff; color: #1d2433; }
  input:focus { outline: 2px solid #5b3fd6; border-color: #5b3fd6; }
  button { margin-top: 14px; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: #5b3fd6; color: #fff; font-size: 16px; font-weight: 600; }
  .hint { font-size: 13px; margin-top: 8px; }
  .err { color: #c0262d; font-size: 14px; margin-top: 8px; min-height: 1em; }
  .uz { margin-top: 16px; font-size: 13px; color: #6b7385; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- Обычно приложение открывает сервер (server.url в capacitor.config.ts), а эта страница не видна.
     В отладочной сборке для локальной сети (MOBILE_DEV_SETUP=1) здесь выбирается адрес сервера. -->
<main id="setup" hidden>
  <div class="icon" aria-hidden="true"><svg width="44" height="31" xmlns="http://www.w3.org/2000/svg" viewBox="10.5 22.5 79 55"><defs><mask id="mL" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M64.68 71.84 A22 22 0 0 1 40.96 56.43" fill="none" stroke="#000" stroke-width="16.2"/></mask>
<mask id="mR" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M35.32 28.16 A22 22 0 0 1 59.04 43.57" fill="none" stroke="#000" stroke-width="16.2"/></mask></defs>
<g transform="translate(0 0) scale(1)"><circle cx="38" cy="50" r="22" fill="none" stroke="#fff" stroke-width="11" mask="url(#mL)"/><circle cx="62" cy="50" r="22" fill="none" stroke="#fff" stroke-width="11" mask="url(#mR)"/></g></svg></div>
  <h1>Адрес сервера</h1>
  <p>Тестовая сборка. Введите адрес компьютера, на котором запущена платформа, в той же Wi‑Fi сети.</p>
  <form id="form" novalidate>
    <label for="url">Адрес · Server manzili</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.10:3000">
    <div class="hint">Пример: <b>http://192.168.1.10:3000</b> — IP компьютера и порт 3000.</div>
    <div class="err" id="err" role="alert"></div>
    <button type="submit">Подключиться · Ulanish</button>
  </form>
  <p class="uz">Test versiya. Platforma ishga tushirilgan kompyuterning manzilini kiriting (bir xil Wi‑Fi tarmog‘ida).</p>
</main>
<script src="app-config.js"></script>
<script>
  (function () {
    var cfg = window.APP_CONFIG || {};
    var wantSetup = cfg.devSetup || /[?&]setup=1/.test(location.search);
    if (!wantSetup) {
      window.location.replace(cfg.serverUrl || "offline.html");
      return;
    }
    var cap = window.Capacitor;
    function call(method, data) {
      if (cap && cap.Plugins && cap.Plugins.DevServer) return cap.Plugins.DevServer[method](data || {});
      if (cap && cap.nativePromise) return cap.nativePromise("DevServer", method, data || {});
      return Promise.reject(new Error("Выбор адреса работает только в тестовой сборке приложения"));
    }
    var input = document.getElementById("url");
    var err = document.getElementById("err");
    document.getElementById("setup").hidden = false;
    var last = null;
    try { last = localStorage.getItem("devServerUrl"); } catch (e) {}
    input.value = last || "http://192.168.";
    call("get").then(function (r) { if (r && r.url) input.value = r.url; }).catch(function () {});
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      err.textContent = "";
      var value = input.value.trim();
      if (!/^https?:\/\//i.test(value)) value = "http://" + value;
      if (!/^https?:\/\/[^\/:]+(:\d+)?\/?$/i.test(value)) {
        err.textContent = "Нужен адрес вида http://192.168.1.10:3000";
        return;
      }
      try { localStorage.setItem("devServerUrl", value); } catch (e2) {}
      call("set", { url: value }).catch(function (e3) { err.textContent = (e3 && e3.message) || String(e3); });
    });
  })();
</script>
</body>
</html>
