<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нет связи</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6f8; color: #1d2433;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  main { max-width: 360px; text-align: center; }
  .icon { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 20px; background: #1f5ad6; display: grid; place-items: center; color: #fff; font-size: 36px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: #5b6475; }
  .uz { margin-top: 14px; font-size: 14px; }
  .secondary { background: #fff; color: #1f5ad6; border: 1px solid #c9cfda !important; margin-top: 10px !important; }
  .hint { margin-top: 10px; font-size: 13px; word-break: break-all; }
  [hidden] { display: none !important; }
  button:disabled { opacity: .7; }
  button { margin-top: 22px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #1f5ad6; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">⇅</div>
  <h1>Нет связи с сервером</h1>
  <p>Проверьте интернет и попробуйте ещё раз. Доставщик может открыть сохранённые доставки, когда связь появится хотя бы на минуту.</p>
  <p class="uz"><b>Server bilan aloqa yo‘q.</b> Internetni tekshirib, qayta urinib ko‘ring.</p>
  <button type="button" id="retry">Повторить · Qayta urinish</button>
  <p class="hint" id="status" role="status" hidden></p>
  <button type="button" id="change" class="secondary" hidden>Сменить адрес сервера · Manzilni o‘zgartirish</button>
  <p class="hint" id="current" hidden></p>
</main>
<script src="app-config.js"></script>
<script>
  // Тестовая сборка (локальная сеть): адрес сервера выбран на телефоне и его можно сменить
  var devServer = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.DevServer;
  var devUrl = null;
  if (devServer) {
    devServer.get().then(function (r) {
      if (!r || !r.available) return;
      devUrl = r.url || null;
      document.getElementById("change").hidden = false;
      if (devUrl) {
        var cur = document.getElementById("current");
        cur.textContent = "Сервер: " + devUrl;
        cur.hidden = false;
      }
    }).catch(function () {});
  }
  document.getElementById("change").addEventListener("click", function () {
    window.location.replace("index.html?setup=1");
  });
  // «Повторить» — снова открыть страницу, которая не загрузилась, внутри приложения.
  // На Android проверку связи и сам переход делает приложение (OfflineRetry.open): эта страница открыта
  // с https://localhost, и любой переход с неё, который не удался, Capacitor уводит в системный браузер.
  // Пока связи нет, остаёмся здесь и говорим об этом.
  var offlineRetry = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.OfflineRetry;
  var button = document.getElementById("retry");
  var statusLine = document.getElementById("status");
  var buttonText = button.textContent;
  var retrying = false;
  function busy(on) {
    retrying = on;
    button.disabled = on;
    button.textContent = on ? "Подключение… · Ulanmoqda…" : buttonText;
  }
  function stillOffline() {
    busy(false);
    statusLine.textContent = "Связи пока нет · Aloqa hali yo‘q";
    statusLine.hidden = false;
  }
  function retry() {
    if (retrying) return;
    busy(true);
    statusLine.hidden = true;
    if (offlineRetry && offlineRetry.open) {
      // Удачно — приложение само откроет страницу; busy не снимаем
      offlineRetry.open().then(function (r) { if (!r || !r.ok) stillOffline(); }).catch(stillOffline);
      return;
    }
    // iOS и сборка с выбором адреса: страница лежит в приложении вместе с app-config.js
    var url = devUrl || (window.APP_CONFIG && window.APP_CONFIG.serverUrl) || "index.html";
    window.location.replace(url);
  }
  button.addEventListener("click", retry);
  // Связь вернулась — пробуем сами, не дожидаясь нажатия
  window.addEventListener("online", retry);
</script>
</body>
</html>
